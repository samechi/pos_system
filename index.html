<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グッズ販売 POSレジシステム</title>
    <!-- QRコード読み取り用ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #1e293b;
            --panel-bg: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warn-color: #f59e0b;
            --discount-color: #b45309;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; }

        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .screen.active { display: flex; }

        /* --- 1. ログイン画面 --- */
        #login-screen { justify-content: center; align-items: center; background-color: var(--panel-bg); }
        .login-container { text-align: center; background: #334155; padding: 30px; border-radius: 12px; width: 350px; }
        #staff-id-display { width: 100%; padding: 15px; font-size: 2rem; text-align: center; margin-bottom: 20px; border: none; border-radius: 6px; background: #1e293b; color: #fff; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .keypad button { padding: 20px; font-size: 1.5rem; border: none; border-radius: 8px; background: #475569; color: white; cursor: pointer; }
        .keypad button:active { opacity: 0.8; }
        .keypad .enter-btn { background: var(--accent-color); grid-column: span 3; }

        /* --- 2. メイン画面 --- */
        #main-screen { flex-direction: row; }
        .cart-section { flex: 1; background: var(--panel-bg); border-right: 2px solid #334155; display: flex; flex-direction: column; min-width: 400px; }
        .cart-header { padding: 15px 20px; border-bottom: 1px solid #334155; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .cart-header-left { display: flex; flex-direction: column; gap: 2px; }
        .logout-btn { background: #475569; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: normal; }
        .logout-btn:hover { background: var(--danger-color); }
        
        .cart-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 5px solid var(--accent-color); }
        .cart-item.type-discount { border-left: 5px solid var(--discount-color); background: #292524; }
        
        .cart-item-detail { display: flex; flex-direction: column; gap: 4px; }
        .cart-item-subtotal { font-weight: bold; color: #cbd5e1; }
        .cart-item.type-discount .cart-item-subtotal { color: #fdba74; }

        .cart-summary { padding: 20px; background: #1e293b; border-top: 2px solid #475569; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .total-row { font-size: 1.5rem; color: var(--warn-color); font-weight: bold; margin-top: 10px; }
        .checkout-btn { width: 100%; padding: 15px; background: var(--success-color); border: none; color: white; font-size: 1.2rem; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* 右：メニュー */
        .menu-section { flex: 2; display: flex; flex-direction: column; padding: 20px; height: 100%; overflow: hidden; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; background: #334155; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .tab-btn.active { background: var(--accent-color); font-weight: bold; }
        .item-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; overflow-y: auto; flex: 1; padding-bottom: 20px; }
        .item-grid.active { display: grid; }
        .item-btn { background: #334155; border: none; color: white; padding: 22px 10px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; text-align: center; height: 100px;}
        .item-btn:active { opacity: 0.7; }
        .discount-op { background: var(--discount-color); }
        .discount-op:active { background: #d97706; }

        /* --- モーダル共通設定 --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .qty-modal { background: #334155; padding: 25px; border-radius: 12px; width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .qty-display { width: 100%; padding: 10px; font-size: 2rem; text-align: center; margin-bottom: 15px; border: none; border-radius: 6px; background: #1e293b; color: white; }

        /* --- 3. 決済方法画面 --- */
        #payment-method-screen { justify-content: center; align-items: center; gap: 30px; }
        .method-group { display: flex; gap: 20px; }
        .method-btn { width: 220px; height: 160px; background: #334155; color: white; border: none; border-radius: 12px; font-size: 1.3rem; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }

        /* --- 4. 決済実行画面 --- */
        #checkout-screen { justify-content: center; align-items: center; }
        .modal-box { background: #334155; padding: 30px; border-radius: 12px; width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-box h3 { margin-bottom: 15px; text-align: center; }
        .modal-box input.display-input { width: 100%; padding: 12px; margin: 10px 0; font-size: 1.8rem; background: #1e293b; color: white; border: none; text-align: right; border-radius: 6px; }
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        .btn-group button { flex: 1; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }

        .cash-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .cash-keypad button { padding: 15px; font-size: 1.3rem; border: none; border-radius: 6px; background: #475569; color: white; cursor: pointer; }
        .cash-keypad button:active { opacity: 0.8; }

        /* QRコード読み取りエリア */
        .qr-reader-box { width: 100%; max-width: 320px; margin: 10px auto; border-radius: 8px; overflow: hidden; background: #1e293b; }

        /* リストスタイル（キャンセル・取引一覧用） */
        .tx-list { max-height: 200px; overflow-y: auto; margin: 10px 0; text-align: left; }
        .tx-item { background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }

        @media print {
            body * { display: none !important; }
            #receipt-area, #receipt-area * { display: block !important; }
            #receipt-area { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; padding: 40px; font-family: monospace; line-height: 1.5; font-size: 14px; }
        }
        #receipt-area { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h3 style="margin-bottom: 15px;">社員IDを入力してください</h3>
            <input type="password" id="staff-id-display" readonly placeholder="****">
            <div class="keypad">
                <button onclick="pressLoginKey('1')">1</button><button onclick="pressLoginKey('2')">2</button><button onclick="pressLoginKey('3')">3</button>
                <button onclick="pressLoginKey('4')">4</button><button onclick="pressLoginKey('5')">5</button><button onclick="pressLoginKey('6')">6</button>
                <button onclick="pressLoginKey('7')">7</button><button onclick="pressLoginKey('8')">8</button><button onclick="pressLoginKey('9')">9</button>
                <button onclick="pressLoginKey('C')">C</button><button onclick="pressLoginKey('0')">0</button>
                <button class="enter-btn" onclick="doLogin()">ログイン</button>
            </div>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="cart-section">
            <div class="cart-header">
                <div class="cart-header-left">
                    <span>登録グッズ・明細一覧</span>
                    <small id="op-name" style="color: #94a3b8;"></small>
                </div>
                <button class="logout-btn" onclick="doLogout()">ログアウト</button>
            </div>
            <div id="cart-list" class="cart-list"></div>
            <div class="cart-summary">
                <div class="summary-row"><span>小計（グッズ合計）</span><span id="sum-subtotal">¥0</span></div>
                <div class="summary-row total-row"><span>差引お支払い合計</span><span id="sum-total">¥0</span></div>
                <button class="checkout-btn" onclick="showPaymentMethods()">決済手続き</button>
            </div>
        </div>
        <div class="menu-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('vege', this)">一般グッズ</button>
                <button class="tab-btn" onclick="switchTab('spice', this)">小物類</button>
                <button class="tab-btn" onclick="switchTab('fried', this)">文房具系</button>
                <button class="tab-btn" onclick="switchTab('other', this)">その他</button>
                <button class="tab-btn" onclick="switchTab('disc', this)">▼ 割引・値引</button>
                <button class="tab-btn" onclick="switchTab('custom', this)">特殊処理</button>
            </div>

            <div id="tab-vege" class="item-grid active"></div>
            <div id="tab-spice" class="item-grid"></div>
            <div id="tab-fried" class="item-grid"></div>
            <div id="tab-other" class="item-grid"></div>

            <div id="tab-disc" class="item-grid">
                <button class="item-btn discount-op" onclick="addDiscountToCart('percent', 5, '5% OFF')"><span>5% OFF</span></button>
                <button class="item-btn discount-op" onclick="addDiscountToCart('percent', 10, '10% OFF')"><span>10% OFF</span></button>
                <button class="item-btn discount-op" onclick="addDiscountToCart('percent', 20, '社員割引(20%)')"><span>社員割引(20%)</span></button>
                <button class="item-btn discount-op" onclick="addDiscountToCart('percent', 50, '半額 (50%)')"><span>半額 (50%)</span></button>
                <button class="item-btn discount-op" onclick="addDiscountToCart('fixed', 100, '100円 OFF')"><span>100円 OFF</span></button>
                <button class="item-btn discount-op" onclick="addDiscountToCart('fixed', 500, '500円 OFF')"><span>500円 OFF</span></button>
                <button class="item-btn discount-op" onclick="openCustomDiscountModal()" style="background: #9a3412;"><span>💰 金額指定</span></button>
            </div>

            <div id="tab-custom" class="item-grid">
                <button class="item-btn" onclick="addAllProducts()" style="background: #2563eb;"><span>📦 全商品を追加</span></button>
                <button class="item-btn" onclick="openCustomPriceModal()" style="background: #9a3412;"><span>💰 金額指定商品</span></button>
                <button class="item-btn" onclick="openBalanceModal()" style="background: #0284c7;"><span>💳 残高参照・修正</span></button>
                <button class="item-btn" onclick="openCancelModal()" style="background: var(--danger-color);"><span>↩️ 会計取り消し</span></button>
            </div>
        </div>
    </div>

    <!-- 管理者画面 -->
    <div id="admin-screen" class="screen">
        <div class="cart-section">
            <div class="cart-header">
                <div class="cart-header-left">
                    <span>商品管理</span>
                    <small style="color:#94a3b8;">社員ID 051 用管理画面</small>
                </div>
                <button class="logout-btn" onclick="doLogout()">ログアウト</button>
            </div>
            <div id="product-admin-list" class="cart-list"></div>
            <div class="cart-summary">
                <button class="checkout-btn" onclick="openProductAddModal()" style="background:#2563eb;">新規商品追加</button>
                <button class="checkout-btn" onclick="changeScreen('main-screen')" style="background:#64748b;">レジ画面へ</button>
            </div>
        </div>
    </div>

    <!-- モーダル各種 -->
    <div id="qty-modal-overlay" class="modal-overlay">
        <div class="qty-modal">
            <h3 id="qty-modal-title" style="margin-bottom:10px;">商品名</h3>
            <input type="number" id="qty-display" class="qty-display" readonly value="1">
            <div class="keypad">
                <button onclick="pressQtyKey('1')">1</button><button onclick="pressQtyKey('2')">2</button><button onclick="pressQtyKey('3')">3</button>
                <button onclick="pressQtyKey('4')">4</button><button onclick="pressQtyKey('5')">5</button><button onclick="pressQtyKey('6')">6</button>
                <button onclick="pressQtyKey('7')">7</button><button onclick="pressQtyKey('8')">8</button><button onclick="pressQtyKey('9')">9</button>
                <button onclick="pressQtyKey('C')">C</button><button onclick="pressQtyKey('0')">0</button>
                <button onclick="closeQtyModal()" style="background:#64748b;">キャンセル</button>
                <button class="enter-btn" onclick="confirmQtyAndAdd()" style="background:var(--success-color);">数量決定・追加</button>
            </div>
        </div>
    </div>

    <div id="discount-modal-overlay" class="modal-overlay">
        <div class="qty-modal">
            <h3>値引き金額を入力</h3>
            <input type="number" id="discount-input-display" class="qty-display" readonly value="">
            <div class="keypad">
                <button onclick="pressDiscountKey('1')">1</button><button onclick="pressDiscountKey('2')">2</button><button onclick="pressDiscountKey('3')">3</button>
                <button onclick="pressDiscountKey('4')">4</button><button onclick="pressDiscountKey('5')">5</button><button onclick="pressDiscountKey('6')">6</button>
                <button onclick="pressDiscountKey('7')">7</button><button onclick="pressDiscountKey('8')">8</button><button onclick="pressDiscountKey('9')">9</button>
                <button onclick="pressDiscountKey('C')">C</button><button onclick="pressDiscountKey('0')">0</button>
                <button onclick="closeCustomDiscountModal()" style="background:#64748b;">戻る</button>
                <button class="enter-btn" onclick="confirmCustomDiscount()" style="background:var(--warn-color);">値引き適用</button>
            </div>
        </div>
    </div>

    <!-- 会計取消モーダル（QR読み取り -> 一覧から選択） -->
    <div id="cancel-modal-overlay" class="modal-overlay">
        <div class="qty-modal" style="width: 420px;">
            <h3>会計取り消し</h3>
            <p id="cancel-status" style="font-size:0.85rem; color:#cbd5e1; margin-bottom:10px;">QRコードをかざしてください</p>
            
            <div id="cancel-qr-reader" class="qr-reader-box"></div>

            <div id="cancel-fallback" style="margin-top:5px;">
                <input type="text" id="manual-cancel-card-code" placeholder="[手入力] コード入力" style="width:70%; padding:6px; background:#1e293b; color:white; border:none; border-radius:4px;">
                <button onclick="fetchTransactionsForCancel(document.getElementById('manual-cancel-card-code').value)" style="padding:6px 10px; background:var(--accent-color); color:white; border:none; border-radius:4px; cursor:pointer;">検索</button>
            </div>

            <!-- 取引履歴一覧描画エリア -->
            <div id="cancel-tx-list" class="tx-list" style="display:none;"></div>

            <div class="btn-group" style="margin-top:15px;">
                <button onclick="closeCancelModal()" style="background:#64748b; color:white;">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 残高参照・修正モーダル -->
    <div id="balance-modal-overlay" class="modal-overlay">
        <div class="qty-modal" style="width: 400px;">
            <h3>残高参照・修正</h3>
            <p id="balance-status" style="font-size:0.85rem; color:#cbd5e1; margin-bottom:10px;">QRコードをかざしてください</p>

            <div id="balance-qr-reader" class="qr-reader-box"></div>

            <div id="balance-fallback" style="margin-top:5px;">
                <input type="text" id="manual-balance-card-code" placeholder="[手入力] コード入力" style="width:70%; padding:6px; background:#1e293b; color:white; border:none; border-radius:4px;">
                <button onclick="fetchBalance(document.getElementById('manual-balance-card-code').value)" style="padding:6px 10px; background:var(--accent-color); color:white; border:none; border-radius:4px; cursor:pointer;">照会</button>
            </div>

            <!-- 残高確認・修正エリア -->
            <div id="balance-edit-area" style="display:none; margin-top:15px; background:#1e293b; padding:15px; border-radius:8px;">
                <p style="font-size:0.9rem;">識別ID: <span id="balance-card-id" style="color:var(--accent-color); font-weight:bold;"></span></p>
                <p style="font-size:1.1rem; margin:10px 0;">現在の残高: <strong id="current-balance-val" style="color:var(--warn-color);">¥0</strong></p>
                
                <hr style="border-color:#334155; margin:10px 0;">
                <label style="font-size:0.85rem; display:block; margin-bottom:5px;">変更後の残高を入力:</label>
                <input type="number" id="new-balance-input" class="qty-display" style="font-size:1.5rem; margin-bottom:10px;" placeholder="新残高">
                <button onclick="updateBalance()" style="width:100%; padding:10px; background:var(--success-color); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">残高を更新する</button>
            </div>

            <div class="btn-group" style="margin-top:15px;">
                <button onclick="closeBalanceModal()" style="background:#64748b; color:white;">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 商品管理モーダル -->
    <div id="admin-product-modal-overlay" class="modal-overlay">
        <div class="qty-modal">
            <h3 id="admin-product-modal-title">商品を編集</h3>
            <input type="text" id="admin-product-name" class="qty-display" placeholder="商品名">
            <input type="number" id="admin-product-price" class="qty-display" placeholder="価格" style="margin-top:10px;">
            <select id="admin-product-category" class="qty-display" style="margin-top:10px; padding: 12px;">
                <option value="vege">一般グッズ</option>
                <option value="spice">小物類</option>
                <option value="fried">文房具系</option>
                <option value="other">その他</option>
            </select>
            <div class="keypad" style="grid-template-columns: 1fr 1fr;">
                <button onclick="closeAdminProductModal()" style="background:#64748b;">キャンセル</button>
                <button class="enter-btn" onclick="saveAdminProduct()" style="background:var(--success-color);">保存</button>
            </div>
        </div>
    </div>

    <div id="custom-price-modal-overlay" class="modal-overlay">
        <div class="qty-modal">
            <h3>金額を指定してください</h3>
            <input type="number" id="custom-price-input-display" class="qty-display" readonly value="">
            <div class="keypad">
                <button onclick="pressCustomPriceKey('1')">1</button><button onclick="pressCustomPriceKey('2')">2</button><button onclick="pressCustomPriceKey('3')">3</button>
                <button onclick="pressCustomPriceKey('4')">4</button><button onclick="pressCustomPriceKey('5')">5</button><button onclick="pressCustomPriceKey('6')">6</button>
                <button onclick="pressCustomPriceKey('7')">7</button><button onclick="pressCustomPriceKey('8')">8</button><button onclick="pressCustomPriceKey('9')">9</button>
                <button onclick="pressCustomPriceKey('C')">C</button><button onclick="pressCustomPriceKey('0')">0</button>
                <button onclick="closeCustomPriceModal()" style="background:#64748b;">戻る</button>
                <button class="enter-btn" onclick="confirmCustomPriceProduct()" style="background:var(--accent-color);">商品追加</button>
            </div>
        </div>
    </div>

    <div id="payment-method-screen" class="screen">
        <h2>決済方法を選択してください</h2>
        <div class="method-group">
            <button class="method-btn" onclick="startPay('cash')"><span>💴</span>現金決済</button>
            <button class="method-btn" onclick="startPay('qr')" style="background:#2563eb;"><span>📱</span>QRコード決済</button>
            <button class="method-btn" onclick="startPay('id')"><span>📝</span>決済ID発行<br>(後払い)</button>
        </div>
        <button onclick="changeScreen('main-screen')" style="margin-top:20px; background:none; border:1px solid white; color:white; padding:10px 20px; border-radius:6px; cursor:pointer;">レジ画面に戻る</button>
    </div>

    <div id="checkout-screen" class="screen">
        <div id="cash-panel" class="modal-box" style="display:none;">
            <h3>現金会計</h3>
            <p style="font-size:1.1rem; margin-top:5px; text-align: center;">お支払い合計: <strong id="cash-total-text" style="font-size:1.4rem; color:var(--warn-color);"></strong></p>
            <input type="text" id="cash-receive" class="display-input" placeholder="¥0" readonly>
            <div class="cash-keypad">
                <button onclick="pressCashKey('1')">1</button><button onclick="pressCashKey('2')">2</button><button onclick="pressCashKey('3')">3</button>
                <button onclick="pressCashKey('4')">4</button><button onclick="pressCashKey('5')">5</button><button onclick="pressCashKey('6')">6</button>
                <button onclick="pressCashKey('7')">7</button><button onclick="pressCashKey('8')">8</button><button onclick="pressCashKey('9')">9</button>
                <button onclick="pressCashKey('C')" style="background:var(--danger-color);">C</button><button onclick="pressCashKey('0')">0</button><button onclick="pressCashKey('00')">00</button>
            </div>
            <p style="margin-top:15px; text-align:center; font-size:1.2rem;">お釣り: <strong id="cash-change" style="color:var(--success-color); font-size:1.8rem;">¥0</strong></p>
            <div class="btn-group">
                <button onclick="changeScreen('payment-method-screen')" style="background:#64748b; color:white;">キャンセル</button>
                <button class="enter-btn" onclick="complete('cash')" style="background:var(--success-color); color:white;">精算確定</button>
            </div>
        </div>

        <div id="qr-panel" class="modal-box" style="display:none; text-align:center;">
            <h3>QRコード決済</h3>
            <p style="font-size:1.1rem; margin-top:5px;">お支払い合計: <strong id="qr-total-text" style="font-size:1.4rem; color:var(--warn-color);"></strong></p>
            
            <p id="qr-status" style="color:#60a5fa; margin-top:10px;">カメラにかざしてください...</p>
            
            <div id="qr-reader" class="qr-reader-box"></div>
            
            <div id="qr-fallback" style="margin-top:15px; border-top:1px dashed #475569; padding-top:10px;">
                <p style="font-size:0.8rem; color:#94a3b8;">[手入力用] 識別コードを入力:</p>
                <input type="text" id="manual-qr-code" style="width:100%; padding:8px; margin:5px 0; background:#1e293b; color:white; border:none; border-radius:4px;">

        // ログイン・ログアウト

        function switchTab(tab, btn) {

            btn.classList.add('active');
            document.querySelectorAll('.item-grid').forEach(g => g.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

        function openQtyModal(name, price) {
            selectedItemName = name;
            selectedItemPrice = price;

                else currentQtyInput += k;
            }
            document.getElementById('qty-display').value = currentQtyInput || 0;

            document.getElementById('qty-modal-overlay').classList.remove('active');
        }
        function confirmQtyAndAdd() {
            const qty = parseInt(currentQtyInput) || 0;
            if (qty <= 0) return alert("数量は1以上を入力してください");
            cart.push({ type: 'product', name: selectedItemName, price: selectedItemPrice, qty: qty, uid: Date.now() + Math.random() });
            closeQtyModal();
            renderCart();
        }

        function renderMenu() {
            ['vege', 'spice', 'fried', 'other'].forEach(category => {
                const container = document.getElementById('tab-' + category);
                if (!container) return;
                container.innerHTML = '';
                products.filter(item => item.category === category).forEach(product => {
                    container.innerHTML += `<button class="item-btn" onclick="openQtyModal('${product.name}', ${product.price})"><span>${product.name}</span><span>¥${product.price.toLocaleString()}</span></button>`;
                });
            });
        }

        function renderAdminProductList() {
            const list = document.getElementById('product-admin-list');
            if (!list) return;
            list.innerHTML = '';
            if (products.length === 0) {
                list.innerHTML = '<p style="padding:20px; color:#cbd5e1;">登録商品がありません。</p>';
                return;
            }
            products.forEach(product => {
                list.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-detail">
                            <span style="font-weight:bold;">${product.name}</span>
                            <span style="font-size:0.85rem; color:#94a3b8;">${categoryLabels[product.category]} / ¥${product.price.toLocaleString()}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button onclick="openProductEditModal('${product.id}')" style="background:#2563eb; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">編集</button>
                            <button onclick="deleteProduct('${product.id}')" style="background:var(--danger-color); color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">削除</button>

        function openProductAddModal() {

            document.getElementById('admin-product-modal-title').innerText = '新規商品を追加';
            document.getElementById('admin-product-name').value = '';
            document.getElementById('admin-product-price').value = '';
            document.getElementById('admin-product-category').value = 'vege';
            document.getElementById('admin-product-modal-overlay').classList.add('active');
        }

        function openProductEditModal(id) {
            const product = products.find(item => item.id === id);
            if (!product) return;
            editingProductId = id;
            document.getElementById('admin-product-modal-title').innerText = '商品を編集';
            document.getElementById('admin-product-name').value = product.name;
            document.getElementById('admin-product-price').value = product.price;
            document.getElementById('admin-product-category').value = product.category;
            document.getElementById('admin-product-modal-overlay').classList.add('active');
        }

        function closeAdminProductModal() {
            document.getElementById('admin-product-modal-overlay').classList.remove('active');
        }

        function saveAdminProduct() {
            const name = document.getElementById('admin-product-name').value.trim();
            const price = parseInt(document.getElementById('admin-product-price').value, 10) || 0;
            const category = document.getElementById('admin-product-category').value;
            if (!name) return alert('商品名を入力してください');
            if (price <= 0) return alert('価格は1以上を入力してください');

            if (editingProductId) {
                const product = products.find(item => item.id === editingProductId);
                if (!product) return;
                product.name = name;
                product.price = price;
                product.category = category;
            } else {
                products.push({ id: 'p' + Date.now() + Math.random(), category, name, price });
            }
            closeAdminProductModal();
            renderMenu();
            renderAdminProductList();
        }

        function deleteProduct(id) {
            if (!confirm('本当にこの商品を削除しますか？')) return;
            const index = products.findIndex(item => item.id === id);
            if (index === -1) return;
            products.splice(index, 1);
            renderMenu();
            renderAdminProductList();
        }

        function addAllProducts() {
            products.forEach(product => {
                cart.push({ type: 'product', name: product.name, price: product.price, qty: 1, uid: Date.now() + Math.random() });
            });
            renderCart();
        }

        // 割引処理
        function addDiscountToCart(discountType, value, labelName) {
            let currentTotal = calculateCurrentTotal();
            if (currentTotal <= 0) return alert("割引を適用する対象商品（金額）がありません");
            cart.push({ type: 'discount', name: labelName, discountType: discountType, discountValue: value, uid: Date.now() });
            renderCart();
        }

        function openCustomDiscountModal() {
            if (calculateCurrentTotal() <= 0) return alert("割引を適用する対象商品がありません");

            document.getElementById('discount-input-display').value = "";
            document.getElementById('discount-modal-overlay').classList.add('active');
        }

            const val = parseInt(currentDiscountInput) || 0;
            if (val <= 0) return alert("正しい金額を入力してください");
            if (val > calculateCurrentTotal()) return alert("現在の合計金額を超える値引きはできません");

        // --- 会計取り消し処理（QRコード読み取り -> 一覧選択） ---
        function openCancelModal() {
            document.getElementById('cancel-status').innerText = "QRコードをかざしてください";
            document.getElementById('cancel-tx-list').style.display = "none";
            document.getElementById('cancel-tx-list').innerHTML = "";
            document.getElementById('manual-cancel-card-code').value = "";
            document.getElementById('cancel-modal-overlay').classList.add('active');

            if (!cancelQrScanner) {
                cancelQrScanner = new Html5Qrcode("cancel-qr-reader");
            }
            cancelQrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    stopCancelScan().then(() => {
                        fetchTransactionsForCancel(decodedText);
                    });
                },
                () => {}
            ).catch(err => {
                document.getElementById('cancel-status').innerText = "カメラの起動に失敗しました";
            });
        }

        async function stopCancelScan() {
            if (cancelQrScanner && cancelQrScanner.isScanning) {
                try { await cancelQrScanner.stop(); } catch (e) {}
            }
        }

        function closeCancelModal() {
            stopCancelScan().then(() => {
                document.getElementById('cancel-modal-overlay').classList.remove('active');
            });
        }

        async function fetchTransactionsForCancel(cardCode) {
            if (!cardCode) return alert("識別コードを入力してください");

            document.getElementById('cancel-status').innerText = "取引履歴を取得中...";
            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getTransactions", cardCode: cardCode })
                });
                const res = await response.json();

                if (res.success && res.transactions && res.transactions.length > 0) {
                    document.getElementById('cancel-status').innerText = "取り消す決済を選択してください";
                    renderCancelTxList(res.transactions);
                } else {
                    document.getElementById('cancel-status').innerText = "該当する取引履歴が見つかりませんでした";
                    document.getElementById('cancel-tx-list').style.display = "none";
                }
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
                document.getElementById('cancel-status').innerText = "エラーが発生しました";
            }
        }

        function renderCancelTxList(transactions) {
            const listEl = document.getElementById('cancel-tx-list');
            listEl.innerHTML = "";
            listEl.style.display = "block";

            transactions.forEach(tx => {
                listEl.innerHTML += `
                    <div class="tx-item">
                        <div>
                            <div><strong>ID:</strong> ${tx.payId}</div>
                            <div style="color:#94a3b8; font-size:0.75rem;">${tx.date} - ¥${tx.amount.toLocaleString()}</div>
                        </div>
                        <button onclick="executeCancel('${tx.payId}')" style="background:var(--danger-color); color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">取り消し</button>
                    </div>`;
            });
        }

        async function executeCancel(payId) {
            if (!confirm(`決済ID: ${payId}\nの会計を取り消しますか？`)) return;

            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "cancel", payId: payId })
                });
                const res = await response.json();

                if (res.success) {
                    alert(res.message);
                    closeCancelModal();
                } else {
                    alert("エラー: " + res.message);
                }
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
            }
        }

        // --- 残高参照・修正処理 ---
        function openBalanceModal() {
            document.getElementById('balance-status').innerText = "QRコードをかざしてください";
            document.getElementById('balance-edit-area').style.display = "none";
            document.getElementById('manual-balance-card-code').value = "";
            activeBalanceCardCode = "";
            document.getElementById('balance-modal-overlay').classList.add('active');

            if (!balanceQrScanner) {
                balanceQrScanner = new Html5Qrcode("balance-qr-reader");
            }
            balanceQrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    stopBalanceScan().then(() => {
                        fetchBalance(decodedText);
                    });
                },
                () => {}
            ).catch(err => {
                document.getElementById('balance-status').innerText = "カメラの起動に失敗しました";
            });
        }

        async function stopBalanceScan() {
            if (balanceQrScanner && balanceQrScanner.isScanning) {
                try { await balanceQrScanner.stop(); } catch (e) {}
            }
        }

        function closeBalanceModal() {
            stopBalanceScan().then(() => {
                document.getElementById('balance-modal-overlay').classList.remove('active');
            });
        }

        async function fetchBalance(cardCode) {
            if (!cardCode) return alert("識別コードを入力してください");

            document.getElementById('balance-status').innerText = "残高を照会中...";
            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getBalance", cardCode: cardCode })
                });
                const res = await response.json();

                if (res.success) {
                    activeBalanceCardCode = cardCode;
                    document.getElementById('balance-status').innerText = "残高情報が読み込まれました";
                    document.getElementById('balance-card-id').innerText = cardCode;
                    document.getElementById('current-balance-val').innerText = "¥" + res.balance.toLocaleString();
                    document.getElementById('new-balance-input').value = res.balance;
                    document.getElementById('balance-edit-area').style.display = "block";
                } else {
                    alert("エラー: " + res.message);
                    document.getElementById('balance-status').innerText = "残高取得に失敗しました";
                }
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
                document.getElementById('balance-status').innerText = "エラーが発生しました";
            }
        }

        async function updateBalance() {
            const newBalance = parseInt(document.getElementById('new-balance-input').value, 10);
            if (isNaN(newBalance) || newBalance < 0) return alert("正しい残高金額を入力してください");
            if (!activeBalanceCardCode) return alert("対象カード情報が見つかりません");

            if (!confirm(`識別ID: ${activeBalanceCardCode}\nの残高を ¥${newBalance.toLocaleString()} に更新しますか？`)) return;

            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "updateBalance",
                        cardCode: activeBalanceCardCode,
                        newBalance: newBalance
                    })
                });
                const res = await response.json();

                if (res.success) {
                    alert(res.message);
                    document.getElementById('current-balance-val').innerText = "¥" + newBalance.toLocaleString();
                } else {
                    alert("更新エラー: " + res.message);
                }
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
            }
        }

        function removeItem(uid) {
            cart = cart.filter(i => i.uid !== uid);
            renderCart();
        }

        function calculateCurrentTotal() {
            let runningTotal = 0;
            cart.forEach(item => {
                if (item.type === 'product') {
                    runningTotal += (item.price * item.qty);
                } else if (item.type === 'discount') {
                    if (item.discountType === 'percent') {
                        runningTotal -= Math.floor(runningTotal * (item.discountValue / 100));
                    } else if (item.discountType === 'fixed') {
                        runningTotal -= item.discountValue;
                    }
                }
            });
            return Math.max(0, runningTotal);
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = "";
            let runningTotal = 0;
            let productSubtotal = 0;
            
            cart.forEach(item => {
                let displayPriceText = "";
                let itemClass = "cart-item";

                if (item.type === 'product') {
                    let itemSub = item.price * item.qty;
                    runningTotal += itemSub;
                    productSubtotal += itemSub;
                    displayPriceText = `¥${itemSub.toLocaleString()}`;
                    
                    list.innerHTML += `
                        <div class="${itemClass} type-product">
                            <div class="cart-item-detail">
                                <span style="font-weight:bold;">${item.name}</span>
                                <span style="font-size:0.85rem; color:#94a3b8;">¥${item.price} × ${item.qty}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="cart-item-subtotal">${displayPriceText}</span>
                                <button onclick="removeItem(${item.uid})" style="background:var(--danger-color); color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">削除</button>
                            </div>
                        </div>`;
                } 
                else if (item.type === 'discount') {
                    itemClass += " type-discount";
                    let discountAmount = 0;
                    if (item.discountType === 'percent') {
                        discountAmount = Math.floor(runningTotal * (item.discountValue / 100));
                    } else if (item.discountType === 'fixed') {
                        discountAmount = item.discountValue;
                    }
                    runningTotal -= discountAmount;
                    displayPriceText = `-¥${discountAmount.toLocaleString()}`;

                    list.innerHTML += `
                        <div class="${itemClass}">
                            <div class="cart-item-detail">
                                <span style="font-weight:bold; color:#fdba74;">${item.name}</span>
                                <span style="font-size:0.85rem; color:#a8a29e;">適応時の小計から差し引き</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="cart-item-subtotal">${displayPriceText}</span>
                                <button onclick="removeItem(${item.uid})" style="background:var(--danger-color); color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">削除</button>
                            </div>
                        </div>`;
                }
            });
            
            document.getElementById('sum-subtotal').innerText = "¥" + productSubtotal.toLocaleString();
            document.getElementById('sum-total').innerText = "¥" + Math.max(0, runningTotal).toLocaleString();
        }

        function showPaymentMethods() {
            if (cart.filter(i => i.type === 'product').length === 0) return alert("商品が登録されていません");
            changeScreen('payment-method-screen');
        }

        function startPay(type) {
            payType = type;
            changeScreen('checkout-screen');
            const total = document.getElementById('sum-total').innerText;
            
            document.getElementById('cash-panel').style.display = 'none';
            document.getElementById('qr-panel').style.display = 'none';
            document.getElementById('id-panel').style.display = 'none';

            if (type === 'cash') {
                document.getElementById('cash-panel').style.display = 'block';
                document.getElementById('cash-total-text').innerText = total;
                currentCashInput = "";
                document.getElementById('cash-receive').value = "¥0";
                document.getElementById('cash-change').innerText = "¥0";
            } else if (type === 'qr') {
                document.getElementById('qr-panel').style.display = 'block';
                document.getElementById('qr-total-text').innerText = total;
                startQRScan();
            } else {
                document.getElementById('id-panel').style.display = 'block';
                document.getElementById('id-total-text').innerText = total;
                document.getElementById('display-pay-id').innerText = "PAY-" + Date.now().toString().slice(-6);
                document.getElementById('display-pay-date').innerText = new Date().toLocaleDateString();
            }
        }

        async function startQRScan() {
            const statusEl = document.getElementById('qr-status');
            statusEl.innerText = "カメラを起動しています...";
            isProcessingPayment = false;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        if (!isProcessingPayment) {
                            isProcessingPayment = true;
                            stopQRScan().then(() => {
                                processQRPayment(decodedText);
                            });
                        }
                    },
                    () => {}
                );
                statusEl.innerText = "カメラにかざしてください...";
            } catch (err) {
                statusEl.innerText = "カメラの起動に失敗しました（パーミッションを確認してください）";
            }
        }

        async function stopQRScan() {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.stop(); } catch (e) {}
            }
        }

        function cancelQRScan() {
            stopQRScan().then(() => {
                changeScreen('payment-method-screen');
            });
        }

        async function processQRPayment(qrCodeVal) {
            if (!qrCodeVal) return alert("識別コードが正しくありません");

            const statusEl = document.getElementById('qr-status');
            statusEl.innerText = "通信・決済処理中...";

            const totalAmount = parseInt(document.getElementById('sum-total').innerText.replace(/[^0-9]/g, ""));

            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "pay",
                        cardCode: qrCodeVal,
                        amount: totalAmount
                    })
                });
                const res = await response.json();

                if (res.success) {
                    complete('qr', res);
                } else {
                    alert("決済エラー: " + res.message);
                    statusEl.innerText = "エラー: " + res.message;
                    isProcessingPayment = false;
                }
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
                statusEl.innerText = "通信エラーが発生しました";
                isProcessingPayment = false;
            }
        }

        function pressCashKey(k) {
            if (k === 'C') {
                currentCashInput = "";
            } else {
                if (currentCashInput === "" && (k === '0' || k === '00')) return;
                currentCashInput += k;
            }
            const numValue = parseInt(currentCashInput) || 0;
            document.getElementById('cash-receive').value = "¥" + numValue.toLocaleString();
            calcChange(numValue);
        }

        function calcChange(receiveValue) {
            const total = parseInt(document.getElementById('sum-total').innerText.replace(/[^0-9]/g, ""));
            const change = Math.max(0, receiveValue - total);
            document.getElementById('cash-change').innerText = "¥" + change.toLocaleString();
        }

        function complete(type, qrResData = null) {
            const totalAmount = parseInt(document.getElementById('sum-total').innerText.replace(/[^0-9]/g, ""));
            const receiveAmount = parseInt(currentCashInput) || 0;

            if (type === 'cash' && receiveAmount < totalAmount) {
                return alert("お預かり金額が合計金額に満たしていません。");
            }

            const area = document.getElementById('receipt-area');
            const date = new Date().toLocaleString();
            
            let html = `<h1>【グッズ販売領収書】</h1><p>発行日時: ${date}</p><p>販売担当: ${staffId}</p><hr style="margin:10px 0;">`;
            
            let runningTotal = 0;
            cart.forEach(item => {
                if (item.type === 'product') {
                    let sub = item.price * item.qty;
                    runningTotal += sub;
                    html += `<p>${item.name} (¥${item.price}) × ${item.qty} : ¥${sub.toLocaleString()}</p>`;
                } else {
                    let disc = 0;
                    if (item.discountType === 'percent') disc = Math.floor(runningTotal * (item.discountValue / 100));
                    else disc = item.discountValue;
                    runningTotal -= disc;
                    html += `<p style="color:#555;">┗ ${item.name} : -¥${disc.toLocaleString()}</p>`;
                }
            });
            
            html += `<hr style="margin:10px 0;">`;
            html += `<h2>最終お支払い合計: ¥${Math.max(0, runningTotal).toLocaleString()}</h2>`;
            
            if (type === 'cash') {
                html += `<p>お預かり: ¥${receiveAmount.toLocaleString()}</p>`;
                html += `<p>お釣り: ${document.getElementById('cash-change').innerText}</p>`;
            } else if (type === 'qr' && qrResData) {
                html += `<br><h3>【QRコード決済受領書】</h3>`;
                html += `<p>決済ID: ${qrResData.payId}</p>`;
                html += `<p>残高: ¥${qrResData.remainingBalance.toLocaleString()}</p>`;
            } else if (type === 'id') {
                html += `<br><h3>【後払い受領書】</h3>`;
                html += `<p>決済ID: ${document.getElementById('display-pay-id').innerText}</p>`;
                html += `<p>申請日: ${document.getElementById('display-pay-date').innerText}</p>`;
            }
            
            area.innerHTML = html;
            showPaymentResult(type, totalAmount, receiveAmount, qrResData);
        }

        function showPaymentResult(type, totalAmount, receiveAmount, qrResData) {
            document.getElementById('cash-panel').style.display = 'none';
            document.getElementById('qr-panel').style.display = 'none';
            document.getElementById('id-panel').style.display = 'none';
            
            const result = document.getElementById('payment-result-content');
            let resultHtml = `<p>お支払い合計: <strong>¥${totalAmount.toLocaleString()}</strong></p>`;
            
            if (type === 'cash') {
                resultHtml += `<p>お預かり: <strong>¥${receiveAmount.toLocaleString()}</strong></p>`;
                resultHtml += `<p>お釣り: <strong>¥${Math.max(0, receiveAmount - totalAmount).toLocaleString()}</strong></p>`;
            } else if (type === 'qr' && qrResData) {
                resultHtml += `<p>お支払い方法: <strong>QRコード決済</strong></p>`;
                resultHtml += `<p>決済ID: <strong style="color:var(--accent-color);">${qrResData.payId}</strong></p>`;
                resultHtml += `<p>利用後残高: <strong style="color:var(--success-color);">¥${qrResData.remainingBalance.toLocaleString()}</strong></p>`;
            } else {
                resultHtml += `<p>お預かり: <strong>後払い</strong></p>`;
                resultHtml += `<p>お釣り: <strong>¥0</strong></p>`;
            }
            
            result.innerHTML = resultHtml;
            document.getElementById('payment-result-panel').style.display = 'block';
            cart = [];
            currentCashInput = "";
            renderCart();
        }

        function resetAfterComplete() {
            document.getElementById('payment-result-panel').style.display = 'none';
            changeScreen('main-screen');
        }
    </script>
</body>
</html>
